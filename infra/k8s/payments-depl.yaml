apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: omarelsady/payments
          env:
            - name: NATS_CLIENT_ID
              valueFrom: #env variable to store the NATS client ID
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: 'http://nats-srv:4222' #env variable to store the NATS server URL
            - name: NATS_CLUSTER_ID
              value: 'ticketing' #env variable to store the NATS cluster ID
            - name: MONGO_URI
              value: 'mongodb://payments-mongo-srv:27017/payments' #env variable to store the MongoDB connection URI
            - name: JWT_KEY #env variable to store the JWT secret key
              valueFrom:
                secretKeyRef:
                  name: jwt-secret # name of the kubernetes secret that contains the JWT secret key
                  key: JWT_KEY # key in the secret that contains the JWT secret key
            - name: STRIPE_KEY #env variable to store the Stripe secret key
              valueFrom:
                secretKeyRef:
                  name: stripe-secret # name of the kubernetes secret that contains the Stripe secret key
                  key: STRIPE_KEY # key in the secret that contains the Stripe secret key
---
apiVersion: v1
kind: Service
metadata:
  name: payments-srv
spec:
  selector:
    app: payments
  ports:
    - name: payments
      protocol: TCP
      port: 3000
      targetPort: 3000
